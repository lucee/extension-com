name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish (a new build number) to Maven Central'
        type: boolean
        default: false
      qualifier:
        description: 'Qualifier for this run. "pom" keeps extension.version.qualifier from pom.xml (-SNAPSHOT); pick RC, BETA, ALPHA or release (none) to publish a release candidate or final release from the current code'
        type: choice
        options: [pom, SNAPSHOT, ALPHA, BETA, RC, release]
        default: pom

# Run builds of the same ref one after another, so every push to main resolves its own
# revision (highest build + 1) only after the previous build has published and created its tag.
# PRs have their own ref (refs/pull/N/merge), so they are not blocked by main builds.
# queue: max keeps up to 100 pending runs (default would keep only one and cancel older pending runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lucee_matrix: ${{ steps.lucee-matrix.outputs.MATRIX }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # Repository and organization variables are not passed to pull_request runs from forks, so
      # vars.LUCEE_TEST_VERSIONS_7 is empty there and fromJSON('') fails the whole run before build-and-test starts.
      # Use the variable when it is set, otherwise test the latest build of each Lucee line through
      # a version query (script-runner resolves it), so fork PRs are tested too.
      - name: Resolve Lucee test matrix
        id: lucee-matrix
        env:
          TEST_VERSIONS: ${{ vars.LUCEE_TEST_VERSIONS_7 }}
          # this extension works with Lucee 7.0.0.395 or newer (luceeCoreVersion in pom.xml), 9.0 is where the core has no COM anymore
          FALLBACK_LINES: "7.0 7.1 8.0"
          REQUIRED_LINES: "9.0"
        run: |
          set -euo pipefail
          if [[ -n "${TEST_VERSIONS// }" ]] && echo "$TEST_VERSIONS" | jq -e 'type == "array" and length > 0' > /dev/null; then
            echo "Using vars.LUCEE_TEST_VERSIONS_7"
            MATRIX=$(echo "$TEST_VERSIONS" | jq -c '.')
          else
            echo "::notice::vars.LUCEE_TEST_VERSIONS_7 is not available (fork pull request?), testing the latest build of: ${FALLBACK_LINES}"
            MATRIX=$(printf '%s\n' $FALLBACK_LINES | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({version: (. + "/all/light"), query: (. + "/all/light")})')
          fi
          for LINE in $REQUIRED_LINES; do
            if ! echo "$MATRIX" | jq -e --arg l "$LINE" 'any(.[]; ((.query // "") | startswith($l + "/")) or ((.version // "") | test("^[a-z]*-?" + ($l | gsub("\\."; "\\.")) + "\\.")))' > /dev/null; then
              echo "Adding the latest ${LINE} build to the matrix"
              MATRIX=$(echo "$MATRIX" | jq -c --arg l "$LINE" '. + [{version: ($l + "/all/light"), query: ($l + "/all/light")}]')
            fi
          done
          # also test the oldest supported core, luceeCoreVersion from pom.xml (Lucee jar from the CDN)
          MIN_VERSION=$(mvn -B help:evaluate -Dexpression=luceeCoreVersion -q -DforceStdout | tr -d '\r')
          if ! [[ "$MIN_VERSION" =~ ^[0-9]+(\.[0-9]+){3}(-[A-Z]+)?$ ]]; then
            echo "::error::[${MIN_VERSION}] is not a valid luceeCoreVersion"
            exit 1
          fi
          # drop entries older than luceeCoreVersion: a version is compared in full, a line (7.0/...) by major.minor
          MATRIX=$(echo "$MATRIX" | jq -c --arg min "${MIN_VERSION%%-*}" '
            def nums: [scan("[0-9]+") | tonumber];
            ($min | nums) as $m
            | map(select(
                ([(.version // ""), (.query // "")] | map([match("[0-9]+(\\.[0-9]+){1,3}").string]) | add | first // "") as $v
                | if $v == "" then true
                  else ($v | nums) as $n | if ($n | length) < 4 then $n >= $m[0:($n | length)] else $n >= $m end
                  end))')
          if ! echo "$MATRIX" | jq -e --arg v "$MIN_VERSION" 'any(.[]; (.version // "") | endswith($v))' > /dev/null; then
            echo "Adding the minimum supported version ${MIN_VERSION} to the matrix"
            MATRIX=$(echo "$MATRIX" | jq -c --arg v "light-$MIN_VERSION" '. + [{version: $v, query: ""}]')
          fi
          # artifact names cannot contain "/", so give every entry a label.
          # testRef is the lucee/lucee branch of the same line (6.2, 7.1, ...), so each core runs the test suite
          # written for it; tests for core fixes on newer lines would otherwise fail on older cores.
          MATRIX=$(echo "$MATRIX" | jq -c 'map(. + {label: ((.version // .query) | gsub("[^A-Za-z0-9._-]"; "-")), testRef: ((([.query, .version] | map(select(. != null and . != "")) | first // "") | capture("(?<l>[0-9]+\\.[0-9]+)").l) // "")})')
          echo "Lucee test matrix: ${MATRIX}"
          echo "MATRIX=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # like Lucee core (LDEV-6516): every push to main publishes a new build, a manual run publishes when deploy is ticked.
      # PRs never publish. Runs without the deploy secrets (forks) only build and test, see "Resolve next revision".
      DO_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      QUALIFIER_INPUT: ${{ inputs.qualifier || 'pom' }}
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}
      deploy: ${{ steps.extract-version.outputs.DEPLOY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
      # leaves maven-metadata-local.xml in the staging dir, which Central rejects. Pin Maven 3.9.x like Lucee core.
      - name: Set up Maven 3.9.16
        run: |
          MVN_VERSION=3.9.16
          MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v

      - name: Resolve next revision
        run: |
          set -euo pipefail
          # Only builds that publish allocate a build number: every push to main and manual runs with deploy ticked.
          # PRs and runs without the deploy secrets (forks) keep the default POM revision (base.0 + qualifier) and publish nothing.
          if [ "$DO_DEPLOY" != "true" ]; then
            echo "Skipping revision bump (not a push to main / manual deploy)"
            exit 0
          fi
          # without deploy credentials nothing gets published, so do not consume a build number
          if [ "${{ secrets.GPG_PASSPHRASE }}" == "" ] || [ "${{ secrets.MAVEN_USERNAME }}" == "" ]; then
            echo "Skipping revision bump (no GPG / Maven deploy credentials; test-only run)"
            exit 0
          fi

          BASE=$(mvn help:evaluate -Dexpression=extension.version.base -q -DforceStdout | tr -d '\r')
          QUALIFIER=$(mvn help:evaluate -Dexpression=extension.version.qualifier -q -DforceStdout | tr -d '\r')
          # an empty property evaluates to "null"
          [ "$QUALIFIER" == "null" ] && QUALIFIER=""
          # a manual run can publish the current code as ALPHA, BETA, RC or final release instead of the pom qualifier
          case "$QUALIFIER_INPUT" in
            pom|"") ;;
            release) QUALIFIER="" ;;
            SNAPSHOT|ALPHA|BETA|RC) QUALIFIER="-$QUALIFIER_INPUT" ;;
            *) echo "::error::unknown qualifier input [$QUALIFIER_INPUT]"; exit 1 ;;
          esac
          echo "Base=$BASE qualifier=$QUALIFIER"
          BASE_RE=$(printf '%s' "$BASE" | sed 's/\./\\./g')

          git fetch --tags --force origin 2>/dev/null || true

          # highest build of this base, from git tags (base.N), Maven Central and the Central snapshot repository (base.N[-QUALIFIER]).
          # Both are checked, so a version published without a tag (e.g. 4.2.0.0-ALPHA) is never built twice.
          BUILDS=$(git tag -l "${BASE}.*" | sed -nE "s/^${BASE_RE}\.([0-9]+)$/\1/p" || true)
          for url in \
            "https://repo1.maven.org/maven2/org/lucee/com-extension/maven-metadata.xml" \
            "https://repo1.maven.org/maven2/org/lucee/com/maven-metadata.xml" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/com-extension/maven-metadata.xml" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/com/maven-metadata.xml"
          do
            META=$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)
            BUILDS="$BUILDS"$'\n'$(printf '%s' "$META" | grep -oE "<version>${BASE_RE}\.[0-9]+([-.][^<]*)?</version>" | sed -E "s#<version>${BASE_RE}\.([0-9]+).*#\1#" || true)
          done
          MAX_BUILD=$(printf '%s\n' "$BUILDS" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)

          if [ -z "$MAX_BUILD" ]; then
            NEXT_BUILD=0
          else
            NEXT_BUILD=$((MAX_BUILD + 1))
          fi

          VERSION="${BASE}.${NEXT_BUILD}${QUALIFIER}"
          # tag shape matches existing tags (4.1.0.0, 3.0.0.54): numeric 4-part without qualifier
          TAG="${BASE}.${NEXT_BUILD}"
          echo "Resolved VERSION=$VERSION TAG=$TAG (max seen build=${MAX_BUILD:-none})"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DEPLOY=true" >> "$GITHUB_ENV"

      - name: Extract version number
        id: extract-version
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){3}(-[A-Za-z0-9]+)*$'; then
            echo "::error::[$VERSION] is not a valid extension version"; exit 1
          fi
          echo "Using VERSION=$VERSION TAG=${TAG:-}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=${TAG:-}" >> $GITHUB_OUTPUT
          echo "DEPLOY=${DEPLOY:-false}" >> $GITHUB_OUTPUT

      - name: Build extension
        env:
          VERSION: ${{ steps.extract-version.outputs.VERSION }}
        run: mvn -B -e clean package -Dgoal=install -Drevision="$VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: com-lex
          path: |
            target/*.lex
            !target/*.lite.lex

      # everything the S3 upload needs (LDEV-6568): full and lite .lex plus the flattened POM
      - name: Upload artifact for S3
        if: steps.extract-version.outputs.DEPLOY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: com-s3
          include-hidden-files: true
          path: |
            target/*.lex
            .flattened-pom.xml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache Lucee files
        uses: actions/cache@v5
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: com-lex
          path: target

      - name: Checkout Lucee
        uses: actions/checkout@v6
        with:
          repository: lucee/lucee
          path: lucee
          ref: ${{ matrix.lucee.testRef }}

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: com
          testAdditional: ${{ github.workspace }}/tests

  # the COM code can only be tested on Windows
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee_matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: com-lex
          path: target

      - name: Checkout Lucee
        uses: actions/checkout@v6
        with:
          repository: lucee/lucee
          path: lucee
          ref: ${{ matrix.lucee.testRef }}

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: com
          testAdditional: ${{ github.workspace }}/tests

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test, test-windows]
    # set by the build job: push to the release branch or manual deploy, with the deploy secrets available
    if: needs.build.outputs.deploy == 'true'
    permissions:
      # push the tag of the published revision
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
      # leaves maven-metadata-local.xml in the staging dir, which Central rejects. Pin Maven 3.9.x like Lucee core.
      - name: Set up Maven 3.9.16
        run: |
          MVN_VERSION=3.9.16
          MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy with Maven
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # central-publishing-maven-plugin sends a -SNAPSHOT version to the Central snapshot repository
          # (https://central.sonatype.com/repository/maven-snapshots/), any other qualifier (-ALPHA, -BETA, -RC or none) to Maven Central.
          # Everything is signed, snapshots included (same as the snapshots published before).
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot $VERSION -------";
            mvn -B -e clean deploy -Dgoal=deploy -DperformRelease=true -Drevision="$VERSION" --settings maven-settings.xml
          else
            echo "------- Maven Deploy release $VERSION -------";
            mvn -B -e clean deploy -Dgoal=deploy -DperformRelease=true -Drevision="$VERSION" --settings maven-settings.xml
          fi

      - name: Tag published revision
        if: success() && needs.build.outputs.tag != ''
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin 2>/dev/null || true
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping"
            exit 0
          fi
          echo "Creating annotated tag $TAG for $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$VERSION"
          git push origin "refs/tags/$TAG"

  # LDEV-6602: publish every final, ALPHA, BETA and RC build as a GitHub release with its .lex files attached,
  # so downloads can be served from GitHub releases. -SNAPSHOT builds get no GitHub release.
  # Separate job, so a failure here never blocks the Maven Central or S3 deploy.
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, deploy]
    if: needs.build.outputs.deploy == 'true' && !endsWith(needs.build.outputs.version, '-SNAPSHOT')
    permissions:
      # create the release (and the tag of a qualifier version) and upload its assets
      contents: write
    steps:
      # the same files the S3 job uploads (built by the build job with the published version)
      - name: Download published extension
        uses: actions/download-artifact@v8
        with:
          name: com-s3
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-files -type f -name "*-${VERSION}.lex" -o -type f -name "*-${VERSION}.lite.lex" | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .lex files for $VERSION found"; find release-files -type f; exit 1
          fi
          printf 'Asset: %s\n' "${FILES[@]}"

          # the release tag is the exact published version. A final release (4.2.0.3) reuses the build tag the deploy job
          # pushed, a qualifier version (4.2.0.3-RC) gets its own tag on the same commit. Qualifier tags do not match
          # the build number lookup (^BASE\.([0-9]+)$) in "Resolve next revision".
          if [[ "$VERSION" == *-* ]]; then
            PRE=(--prerelease --latest=false)
          elif [ "$IS_DEFAULT_BRANCH" == "true" ]; then
            PRE=(--latest)
          else
            PRE=(--latest=false)
          fi
          if [ "$VERSION" == "$TAG" ]; then
            TARGET=(--verify-tag)
          else
            # creates the tag on this commit if it does not exist yet
            TARGET=(--target "$GITHUB_SHA")
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists - uploading assets again"
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            echo "Creating release $VERSION ${PRE[*]} ${TARGET[*]}"
            gh release create "$VERSION" "${FILES[@]}" "${PRE[@]}" "${TARGET[@]}" \
              --title "$VERSION" \
              --notes "Build $VERSION from commit $GITHUB_SHA, published by $RUN_URL"
          fi

  # upload the published build to cdn.lucee.org in Maven layout, LDEV-6568.
  # Cut-off rules (SNAPSHOTs stop on 2027-03-01) live in the called workflow.
  s3:
    needs: [build, deploy]
    if: needs.build.outputs.deploy == 'true'
    uses: lucee/lucee/.github/workflows/extension-s3-upload.yml@7.1
    with:
      artifact-name: com-s3
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
